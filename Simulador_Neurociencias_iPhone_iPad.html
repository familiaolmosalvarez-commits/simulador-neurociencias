<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Neuro Sim">
<meta name="theme-color" content="#8b1e2d">
<title>Simulador Neurociencias</title>
<style>
:root{--accent:#8b1e2d;--bg:#f5f6f8;--card:#fff;--ink:#18212b;--muted:#69727d;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink)}
body{padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-bottom:1px solid #e4e7eb;padding:calc(12px + env(safe-area-inset-top)) 16px 12px}
.head{max-width:900px;margin:auto}
h1{font-size:18px;margin:0;color:var(--accent)} .meta{font-size:12px;color:var(--muted);margin-top:4px}
#track{height:6px;border-radius:99px;background:#eceff2;overflow:hidden;margin-top:10px}#bar{height:100%;background:var(--accent);width:0;transition:.2s}
main{max-width:900px;margin:0 auto;padding:18px 14px 32px}
.card{background:var(--card);border:1px solid #e2e6ea;border-radius:18px;padding:22px;box-shadow:0 8px 24px rgba(0,0,0,.05)}
.start{text-align:center;padding:30px 18px} .start h2{font-size:28px;line-height:1.15;margin:14px 0} .start p{color:#505a65;line-height:1.55}
.tag{display:inline-block;background:#f8e7ea;color:var(--accent);border-radius:99px;padding:6px 10px;font-size:12px;font-weight:700}
.q{font-size:22px;line-height:1.38;margin:20px 0}
textarea{width:100%;min-height:150px;font-size:17px;line-height:1.4;border:1px solid #cbd2d8;border-radius:14px;padding:14px;resize:none;outline:none;-webkit-appearance:none;background:#fff}
textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(139,30,45,.10)}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:18px;flex-wrap:wrap}
.timer{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums} .timer.warn{color:#b7791f} .timer.danger{color:var(--accent)}
button{border:0;border-radius:14px;padding:14px 18px;font-size:16px;font-weight:700;cursor:pointer;min-height:48px;touch-action:manipulation}
.primary{background:var(--accent);color:#fff} .ghost{background:#edf1f4;color:#28313a}
.choice{display:block;max-width:380px;margin:10px auto;padding:14px 16px;border:1px solid #d8dde2;border-radius:14px;text-align:left;background:#fff}
.choice input{transform:scale(1.25);margin-right:10px}
.note{font-size:13px;color:var(--muted)} .ans{padding:14px 0;border-top:1px solid #eee;word-break:break-word}
.lock{margin-top:16px;background:#fff3f4;color:var(--accent);padding:11px 12px;border-radius:12px;font-size:13px}
@media(max-width:600px){main{padding:12px 10px 28px}.card{padding:18px}.q{font-size:20px}.timer{font-size:30px}button{width:100%}.row{align-items:stretch}}
</style>
</head>
<body>
<header><div class="head"><h1>Simulador de Neurociencias</h1><div class="meta" id="meta">30 preguntas abiertas</div><div id="track"><div id="bar"></div></div></div></header>
<main><div id="app"></div></main>
<script>
const Q=[{"tag": "Síndrome epiléptico", "q": "Paciente con episodios breves de desconexión del medio y recuperación inmediata. ¿Qué dato adicional de la anamnesis preguntarías primero para orientar la clasificación de la crisis?"}, {"tag": "Síndrome epiléptico", "q": "Durante un episodio paroxístico, ¿qué dato clínico permite establecer si hubo alteración de la conciencia?"}, {"tag": "EEG", "q": "Un EEG muestra actividad paroxística. ¿Qué correlación clínica debes establecer antes de interpretar ese hallazgo como parte de un síndrome epiléptico?"}, {"tag": "Neuroimagen", "q": "En un paciente con crisis de inicio reciente, la resonancia muestra una lesión focal. ¿Qué relación estructura–función debes establecer para integrar la imagen con la semiología?"}, {"tag": "Farmacología", "q": "Antes de elegir un antiepiléptico, ¿qué dos características del paciente considerarías para relacionar eficacia, seguridad y contexto clínico?"}, {"tag": "Neurodesarrollo", "q": "En un niño con crisis recurrentes, ¿qué aspecto del neurodesarrollo explorarías de forma dirigida y por qué sería relevante?"}, {"tag": "Evento cerebrovascular", "q": "Paciente con déficit neurológico de inicio súbito. ¿Qué característica temporal de la historia clínica apoya primero un evento cerebrovascular?"}, {"tag": "Evento cerebrovascular", "q": "Un paciente presenta debilidad de cara y brazo mayor que en la pierna. ¿Cómo utilizarías esta distribución para orientar la localización neuroanatómica?"}, {"tag": "Lenguaje", "q": "El paciente comprende órdenes pero su producción verbal es escasa y laboriosa. ¿Qué componente del lenguaje está principalmente alterado?"}, {"tag": "Pares craneales", "q": "En un paciente con ECV observas asimetría facial. ¿Qué maniobra del examen ayuda a distinguir compromiso facial central de periférico?"}, {"tag": "Sensibilidad", "q": "Un paciente tiene pérdida sensitiva de cara, brazo y pierna del mismo lado, sin debilidad. ¿Qué patrón semiológico reconoces y qué tipo de localización sugiere?"}, {"tag": "Neuroimagen", "q": "Ante un déficit focal agudo, ¿qué información clave esperas obtener de la neuroimagen inicial antes de definir el horizonte terapéutico?"}, {"tag": "Factores de riesgo", "q": "En la historia clínica de un paciente con sospecha de ECV, ¿qué antecedente cardiovascular preguntarías por su relación con eventos embólicos?"}, {"tag": "Integración vascular", "q": "Si un paciente tiene alteración del lenguaje y déficit motor contralateral, ¿qué dos datos del examen permiten decidir qué hemisferio está comprometido?"}, {"tag": "Conducta clínica", "q": "En un ECV agudo, ¿qué hallazgo clínico o de imagen cambiaría de forma inmediata la estrategia de manejo respecto a un evento isquémico?"}, {"tag": "Trastornos del movimiento", "q": "Paciente con lentitud para iniciar movimientos y reducción del movimiento espontáneo. ¿Qué término semiológico describe mejor este hallazgo?"}, {"tag": "Marcha", "q": "Al observar la marcha, ¿qué tres elementos describirías de forma sistemática antes de asignarle un diagnóstico de trastorno del movimiento?"}, {"tag": "Tono", "q": "Durante la movilización pasiva notas aumento del tono. ¿Qué característica semiológica permite diferenciar rigidez de espasticidad?"}, {"tag": "Temblor", "q": "¿Qué dato del examen físico permite clasificar inicialmente un temblor según aparezca en reposo, postura o acción?"}, {"tag": "Ganglios basales", "q": "Un paciente tiene bradicinesia y rigidez. ¿Qué circuito funcional del control del movimiento considerarías alterado y qué efecto global tendría sobre la ejecución motora?"}, {"tag": "Sistema motor", "q": "En un paciente con debilidad, ¿qué combinación de tono, reflejos y respuesta plantar te orientaría a lesión de neurona motora superior?"}, {"tag": "Unidad motora", "q": "Paciente con debilidad proximal progresiva y reflejos conservados. ¿Qué hallazgo te ayudaría a diferenciar una miopatía de una alteración de la unión neuromuscular?"}, {"tag": "EMG", "q": "¿Qué pregunta clínica principal debe responder un EMG cuando ya sabes que el paciente tiene debilidad?"}, {"tag": "Pares craneales", "q": "Un paciente presenta diplopía. ¿Qué dos pasos del examen de movimientos oculares realizarías para localizar el par craneal comprometido?"}, {"tag": "Reflejos", "q": "En el reflejo fotomotor, ¿por qué evaluar respuesta directa y consensual permite diferenciar una alteración aferente de una eferente?"}, {"tag": "Estado mental", "q": "En un paciente neurológico agudo, ¿qué diferencia semiológica esencial hay entre somnolencia y estupor?"}, {"tag": "Integración estructura–función", "q": "Si una lesión produce simultáneamente alteración motora y sensitiva, ¿qué datos usarías para decidir si la lesión es cortical, subcortical o del tronco encefálico?"}, {"tag": "Semiología integrada", "q": "Un paciente tiene alteración de la marcha, temblor y dificultad para iniciar movimientos. ¿Qué tres dominios del examen neurológico integrarías antes de concluir que se trata de un trastorno del movimiento?"}, {"tag": "Interpretación", "q": "Si la semiología sugiere una localización pero la neuroimagen inicial no muestra una lesión clara, ¿qué principio de integración clínica debes mantener antes de descartar el diagnóstico?"}, {"tag": "Caso integrador final", "q": "Paciente con inicio súbito de alteración del lenguaje, asimetría facial y debilidad unilateral. Organiza tu razonamiento en este orden: síndrome clínico, localización general y estudio inicial más útil."}];
let i=0,answers=[],mode=120,left=120,timer=null,started=false;
const app=document.getElementById('app'), meta=document.getElementById('meta'), bar=document.getElementById('bar');

function startScreen(){
 clearInterval(timer); started=false; i=0; answers=[]; bar.style.width='0%'; meta.textContent='30 preguntas abiertas';
 app.innerHTML=`<div class="card start">
 <span class="tag">COMPATIBLE CON iPHONE / iPAD</span>
 <h2>Simulador de Integración Básico‑Clínica</h2>
 <p>Una pregunta por vez, respuesta corta, avance automático y sin regresar. El enfoque prioriza semiología, localización, estructura–función e interpretación clínica.</p>
 <label class="choice"><input type="radio" name="mode" value="120" checked><b>Modo examen real</b><br><span class="note">2 min por pregunta · 60 min total</span></label>
 <label class="choice"><input type="radio" name="mode" value="60"><b>Modo sprint</b><br><span class="note">1 min por pregunta · 30 min total</span></label>
 <button class="primary" onclick="begin()">Comenzar simulacro</button>
 <div class="lock">Al avanzar, la respuesta queda bloqueada. Si se acaba el tiempo, pasa automáticamente.</div>
 </div>`;
}
function begin(){mode=Number(document.querySelector('input[name=mode]:checked').value);started=true;i=0;answers=[];showQ();}
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function showQ(){
 clearInterval(timer);
 if(i>=Q.length) return finish();
 left=mode; const q=Q[i];
 meta.textContent=`Pregunta ${i+1} de 30 · ${mode===120?'2 min':'1 min'}`;
 bar.style.width=((i/30)*100)+'%';
 app.innerHTML=`<div class="card">
 <span class="tag">${q.tag}</span>
 <div class="q">${q.q}</div>
 <textarea id="ans" maxlength="500" placeholder="Respuesta corta y precisa..." enterkeyhint="done" autocapitalize="sentences" autocomplete="off" spellcheck="true"></textarea>
 <div class="row">
   <div><div id="clock" class="timer">${fmt(left)}</div><div class="note">Avance automático a 00:00.</div></div>
   <button class="primary" onclick="nextQ()">Guardar y continuar →</button>
 </div>
 </div>`;
 const ta=document.getElementById('ans'); setTimeout(()=>ta.focus(),250);
 timer=setInterval(()=>{left--; const c=document.getElementById('clock'); if(!c)return; c.textContent=fmt(left); c.className='timer'+(left<=15?' danger':left<=30?' warn':''); if(left<=0)nextQ();},1000);
}
function nextQ(){
 clearInterval(timer); const ta=document.getElementById('ans'); answers.push(ta?ta.value.trim():''); i++; showQ();
}
function finish(){
 clearInterval(timer); bar.style.width='100%'; meta.textContent='Simulacro finalizado';
 localStorage.setItem('neuroSimAnswers',JSON.stringify(answers));
 app.innerHTML=`<div class="card"><span class="tag">FINALIZADO</span><h2>Terminaste las 30 preguntas</h2>
 <p>Respuestas en blanco: <b>${answers.filter(x=>!x).length}</b>.</p>
 <div class="row"><button class="primary" onclick="review()">Ver respuestas</button><button class="ghost" onclick="downloadTxt()">Guardar respuestas</button><button class="ghost" onclick="startScreen()">Reiniciar</button></div></div>`;
}
function review(){
 app.innerHTML='<div class="card"><h2>Mis respuestas</h2>'+Q.map((q,j)=>`<div class="ans"><b>${j+1}. ${q.tag}</b><br>${answers[j]||'<i>Sin respuesta</i>'}</div>`).join('')+'<div class="row"><button class="ghost" onclick="finish()">Volver</button></div></div>';
 window.scrollTo({top:0,behavior:'smooth'});
}
function downloadTxt(){
 const text=Q.map((q,j)=>`${j+1}. ${answers[j]||'[sin respuesta]'}`).join('\n');
 const blob=new Blob([text],{type:'text/plain;charset=utf-8'});
 const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='respuestas_neurociencias.txt'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1000);
}
startScreen();
</script>
</body></html>
